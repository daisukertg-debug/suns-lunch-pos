<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUN'S LUNCH POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
font-family: sans-serif;
margin: 0;
padding: 20px;
background: #f5f5f5;
}

h1 {
margin-bottom: 20px;
}

#tables {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}

.table {
background: white;
border: 1px solid #ddd;
border-radius: 10px;
padding: 20px;
text-align: center;
font-size: 20px;
cursor: pointer;
user-select: none;
}

.table:active {
transform: scale(0.98);
}

.status {
margin-top: 8px;
font-size: 14px;
color: #555;
}

#message {
margin-bottom: 15px;
color: #555;
}

    #menu {
      display: none;
      margin-top: 20px;
    }

    .menu-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .menu-name {
      font-size: 18px;
      font-weight: bold;
    }

    .menu-price {
      margin-top: 5px;
      color: #555;
    }

    #backButton {
      margin-bottom: 15px;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }
</style>
</head>

<body>

<h1>SUN'S LUNCH POS</h1>

<div id="message">Supabaseから卓情報を読み込み中…</div>

<div id="tables"></div>

  <div id="menu">
    <button id="backButton">← 卓一覧に戻る</button>

    <h2 id="selectedTable"></h2>

    <div id="menuItems"></div>
  </div>

<script>
const SUPABASE_URL = "https://yqyypzqoyhdwuywctyot.supabase.co";

    // 今GitHubに入っている実際のキーをここに入れる
const SUPABASE_ANON_KEY = "sb_publishable_XtBKEaxbFBAIVk4XMNSSjg_Fq4GAGZe";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

    let selectedTable = null;

async function loadTables() {
const { data, error } = await supabaseClient
.from("shop_tables")
.select("id, table_no, status")
.order("table_no");

if (error) {
document.getElementById("message").textContent =
"Supabase接続エラー: " + error.message;
return;
}

const container = document.getElementById("tables");
container.innerHTML = "";

data.forEach(table => {
const div = document.createElement("div");
div.className = "table";

div.innerHTML = `
         <div>卓 ${table.table_no}</div>
         <div class="status">${table.status}</div>
       `;

div.addEventListener("click", () => {
          document.getElementById("message").textContent =
            `卓 ${table.table_no} を選択しました`;
          openMenu(table);
});

container.appendChild(div);
});

document.getElementById("message").textContent =
`${data.length}卓を読み込みました`;
}

    async function openMenu(table) {
      selectedTable = table;

      document.getElementById("tables").style.display = "none";
      document.getElementById("menu").style.display = "block";

      document.getElementById("selectedTable").textContent =
        `卓 ${table.table_no} の注文`;

      document.getElementById("message").textContent =
        "Supabaseからメニューを読み込み中…";

      const { data, error } = await supabaseClient
        .from("menu_items")
        .select("id, name, category, size, price")
        .eq("active", true)
        .order("id");

      if (error) {
        document.getElementById("message").textContent =
          "メニュー取得エラー: " + error.message;
        return;
      }

      const container = document.getElementById("menuItems");
      container.innerHTML = "";

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "menu-item";

        const sizeText = item.size
          ? ` ${item.size}`
          : "";

        div.innerHTML = `
          <div class="menu-name">
            ${item.name}${sizeText}
          </div>
          <div class="menu-price">
            ¥${item.price.toLocaleString()}
          </div>
        `;

        container.appendChild(div);
      });

      document.getElementById("message").textContent =
        `${data.length}品を読み込みました`;
    }

    document.getElementById("backButton").addEventListener("click", () => {
      document.getElementById("menu").style.display = "none";
      document.getElementById("tables").style.display = "grid";

      document.getElementById("message").textContent =
        "卓を選択してください";
    });

loadTables();
</script>

</body>
</html>
