<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUN'S LUNCH POS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
font-family: sans-serif;
margin: 0;
padding: 20px;
background: #f5f5f5;
}

h1 {
margin-bottom: 20px;
}

#tables {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}

.table {
background: white;
border: 1px solid #ddd;
border-radius: 10px;
padding: 20px;
text-align: center;
font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .table:active {
      transform: scale(0.98);
}

.status {
margin-top: 8px;
font-size: 14px;
color: #555;
}

#message {
margin-bottom: 15px;
color: #555;
}
</style>
</head>

<body>

<h1>SUN'S LUNCH POS</h1>

<div id="message">Supabaseから卓情報を読み込み中…</div>

<div id="tables"></div>

<script>
const SUPABASE_URL = "https://yqyypzqoyhdwuywctyot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XtBKEaxbFBAIVk4XMNSSjg_Fq4GAGZe";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

async function loadTables() {
const { data, error } = await supabaseClient
.from("shop_tables")
.select("id, table_no, status")
.order("table_no");

if (error) {
document.getElementById("message").textContent =
"Supabase接続エラー: " + error.message;
return;
}

const container = document.getElementById("tables");
container.innerHTML = "";

data.forEach(table => {
const div = document.createElement("div");
div.className = "table";

div.innerHTML = `
         <div>卓 ${table.table_no}</div>
         <div class="status">${table.status}</div>
       `;

        div.addEventListener("click", () => {
          document.getElementById("message").textContent =
            `卓 ${table.table_no} を選択しました`;
        });

container.appendChild(div);
});

document.getElementById("message").textContent =
`${data.length}卓を読み込みました`;
}

loadTables();
</script>

</body>
</html>
